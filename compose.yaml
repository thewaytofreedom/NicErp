name: nicerp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nicerp
      POSTGRES_USER: nicerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicerp -d nicerp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
